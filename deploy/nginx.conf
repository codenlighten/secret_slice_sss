# secretslices.com: one static file, web/index.html, and nothing else.
#
# The page already carries a Content-Security-Policy in a <meta> tag that
# forbids all network access and pins its script and style by hash. The
# headers below add what a <meta> tag cannot: framing protection, HSTS and
# isolation. Certificates: certbot --nginx -d secretslices.com -d www.secretslices.com

server {
    listen 80;
    listen [::]:80;
    server_name secretslices.com www.secretslices.com;
    # Certificate renewal (certbot --webroot -w /var/www/letsencrypt).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://secretslices.com$request_uri;
    }
}

server {
    listen 443 ssl http2;        # nginx >= 1.25.1: "listen 443 ssl;" plus "http2 on;"
    listen [::]:443 ssl http2;
    server_name www.secretslices.com;
    # ssl_certificate / ssl_certificate_key: managed by certbot
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://secretslices.com$request_uri;
}

server {
    listen 443 ssl http2;        # nginx >= 1.25.1: "listen 443 ssl;" plus "http2 on;"
    listen [::]:443 ssl http2;
    server_name secretslices.com;
    # ssl_certificate / ssl_certificate_key: managed by certbot

    root /var/www/secretslices;      # contains exactly one file: index.html
    index index.html;
    server_tokens off;
    access_log off;                  # the page sends nothing; keep no visitor log either

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }
    location / {
        return 404;
    }
}
